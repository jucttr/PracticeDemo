<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>箭头函数</title>
    </head>
    <body>
        <script>
            function Outer() {
                this.x = 'outer';
                this.arrow = () => this.x;
                this.normal = function () {
                    return this && this.x;
                };
            }
            const o = new Outer();
            o.arrow(); // 'outer'
            console.log(o.arrow.call({ x: 'called' })); // 'outer'
            console.log(o.arrow.bind({ x: 'bound' })()); // 'outer'
            // new o.arrow(); // TypeError: not a constructor
            console.log(o.normal()); // 'outer'，但靠的是隐式绑定，赋出去就丢
        </script>
    </body>
</html>
